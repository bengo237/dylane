name: OWASP ZAP Scan

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    zap_scan:
        runs-on: ubuntu-latest
        name: Scan the web application
        permissions:
            issues: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: master

            - name: ZAP Scan
              id: zap_scan
              uses: zaproxy/action-baseline@v0.14.0
              with:
                  docker_name: "ghcr.io/zaproxy/zaproxy:stable"
                  target: "https://dylane-mu.vercel.app/"
                  rules_file_name: ".zap/rules.tsv"
                  cmd_options: "-a"
                  fail_action: false
                  issue_title: "ZAP Scan Baseline Report"
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload ZAP Reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: zap-reports
                  path: |
                      zap_report.html
                      zap_report.md
                      zap_report.json
